<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FF Admin Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Prompt',sans-serif;
background:linear-gradient(180deg,#f6f1ff,#e8dcff,#d6c8ff);
overflow-x:hidden;
}

/* bubbles */
.bubble{
position:fixed;
bottom:-160px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#fff,#caa6ff,#ffb6e6);
opacity:.35;
animation:floatUp linear infinite;
z-index:-1;
}
@keyframes floatUp{
to{transform:translateY(-120vh);}
}

/* layout */
.container{padding:40px;max-width:1400px;margin:auto;}
.section{margin-bottom:50px;}
.title{
font-size:28px;
font-weight:800;
margin-bottom:25px;
background:linear-gradient(90deg,#6ed0ff,#ff7fbf);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* glass card */
.card{
background:rgba(255,255,255,.75);
backdrop-filter:blur(20px);
border-radius:28px;
padding:25px;
box-shadow:0 30px 80px rgba(180,140,255,.25);
}

/* KPI */
.kpi-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}
.kpi{
text-align:center;
}
.kpi h4{margin:0;font-size:14px;color:#6a5acd;}
.kpi .num{
font-size:32px;
font-weight:800;
background:linear-gradient(90deg,#6ed0ff,#ff7fbf);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* status matrix */
.matrix{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}
.status-card{
font-size:14px;
}
.status-card h3{
margin-top:0;
font-size:16px;
color:#6a5acd;
}
.badge{
display:inline-block;
padding:5px 12px;
border-radius:999px;
font-size:12px;
font-weight:600;
margin-bottom:10px;
}

/* table */
table{
width:100%;
border-collapse:collapse;
}
th,td{
padding:10px;
font-size:13px;
border-bottom:1px solid rgba(200,150,255,.2);
}
th{
text-align:left;
color:#6a5acd;
}

/* live feed */
.feed{
position:fixed;
bottom:20px;
left:20px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(15px);
border-radius:20px;
padding:15px;
width:260px;
box-shadow:0 20px 60px rgba(170,140,255,.3);
font-size:13px;
}
.feed h4{margin:0 0 10px 0;font-size:14px;}
.feed-item{margin-bottom:8px;}

canvas{max-height:300px;}
</style>
</head>

<body>

<!-- bubbles -->
<div class="bubble" style="left:10%;width:130px;height:130px;animation-duration:30s;"></div>
<div class="bubble" style="left:40%;width:90px;height:90px;animation-duration:22s;"></div>
<div class="bubble" style="left:70%;width:150px;height:150px;animation-duration:35s;"></div>

<div class="container">

<!-- KPI STRIP -->
<div class="section">
<div class="title">Dashboard Overview</div>
<div class="card kpi-grid" id="kpis"></div>
</div>

<!-- Revenue -->
<div class="section">
<div class="card">
<h3>📈 รายได้ย้อนหลัง 7 วัน</h3>
<canvas id="revenueChart"></canvas>
</div>
</div>

<!-- Status Matrix -->
<div class="section">
<div class="title">สถานะทั้งหมด</div>
<div class="matrix" id="matrix"></div>
</div>

<!-- Service + Recent -->
<div class="section">
<div style="display:grid;grid-template-columns:1fr 1.2fr;gap:30px;">
<div class="card">
<h3>🍭 Service Breakdown</h3>
<canvas id="serviceChart"></canvas>
</div>

<div class="card">
<h3>📋 10 ออเดอร์ล่าสุด</h3>
<div style="overflow-x:auto;">
<table id="recentTable"></table>
</div>
</div>
</div>
</div>

</div>

<!-- Live Feed -->
<div class="feed">
<h4>🔔 Live Activity</h4>
<div id="feedItems"></div>
</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzIYVFh8xyJ9x4fMrl7pkjxjmnul-8Bn3GlYkuTD9AbRoVYBueV_CbntypcnKHcxzt4/exec";
let revenueChart,serviceChart;

async function loadDashboard(){

const res=await fetch(API_URL);
const data=await res.json();

/* KPIs */
document.getElementById("kpis").innerHTML=`
<div class="kpi"><h4>💰 รายได้วันนี้</h4><div class="num">${data.revenueToday.toLocaleString()}</div></div>
<div class="kpi"><h4>📦 ออเดอร์วันนี้</h4><div class="num">${data.ordersToday}</div></div>
<div class="kpi"><h4>⏳ รอชำระ</h4><div class="num">${data.statusSummary["รอชำระเงิน"].length}</div></div>
<div class="kpi"><h4>🚀 กำลังทำ</h4><div class="num">${data.statusSummary["กำลังดำเนินการ"].length}</div></div>
<div class="kpi"><h4>✅ เสร็จงาน</h4><div class="num">${data.statusSummary["เสร็จงาน"].length}</div></div>
<div class="kpi"><h4>🛠 รอเคลม</h4><div class="num">${data.statusSummary["รอเคลม"].length}</div></div>
<div class="kpi"><h4>⚪ หมดประกัน</h4><div class="num">${data.statusSummary["หมดประกัน"].length}</div></div>
`;

/* Revenue Chart */
if(revenueChart) revenueChart.destroy();
revenueChart=new Chart(document.getElementById("revenueChart"),{
type:'line',
data:{
labels:["6d","5d","4d","3d","2d","1d","Today"],
datasets:[{
label:"Revenue",
data:data.revenue7days,
borderColor:"#a78bfa",
backgroundColor:"rgba(167,139,250,.2)",
tension:.4,
fill:true
}]
}
});

/* Status Matrix */
const matrix=document.getElementById("matrix");
matrix.innerHTML="";
for(let status in data.statusSummary){
matrix.innerHTML+=`
<div class="card status-card">
<h3>${status}</h3>
<div style="font-weight:700;font-size:26px;">${data.statusSummary[status].length}</div>
${data.statusSummary[status].slice(0,3).map(o=>`<div>• ${o.name}</div>`).join("")}
</div>
`;
}

/* Service Chart */
if(serviceChart) serviceChart.destroy();
serviceChart=new Chart(document.getElementById("serviceChart"),{
type:'doughnut',
data:{
labels:Object.keys(data.serviceStats),
datasets:[{
data:Object.values(data.serviceStats),
backgroundColor:["#ff9ed6","#8fd3ff","#caa6ff"]
}]
},
options:{cutout:"65%"}
});

/* Recent Table */
let table="<tr><th>รหัส</th><th>ลูกค้า</th><th>บริการ</th><th>ราคา</th><th>สถานะ</th></tr>";
data.recentOrders.forEach(o=>{
table+=`<tr>
<td>${o.order}</td>
<td>${o.name}</td>
<td>${o.service}</td>
<td>${o.price}</td>
<td>${o.status}</td>
</tr>`;
});
document.getElementById("recentTable").innerHTML=table;

/* Live Feed */
document.getElementById("feedItems").innerHTML=
data.recentOrders.slice(0,5)
.map(o=>`<div class="feed-item">📦 ${o.name} → ${o.status}</div>`)
.join("");

}

loadDashboard();
setInterval(loadDashboard,15000);

</script>
</body>
</html>
