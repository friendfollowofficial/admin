<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Friend Follow Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Prompt',sans-serif;
  background:#f4f6fb;
  display:flex;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:230px;
  background:#1f2937;
  color:white;
  padding:25px 15px;
  min-height:100vh;
}
.logo{
  font-size:20px;
  font-weight:700;
  margin-bottom:30px;
}
.menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  transition:.2s;
  cursor:pointer;
}
.menu a:hover{
  background:#6c63ff;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:30px;
}

/* DASHBOARD */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
}
.count{
  font-size:34px;
  font-weight:700;
}
.list-item{
  background:#f1f3ff;
  padding:8px;
  border-radius:8px;
  margin-bottom:6px;
  font-size:13px;
}
iframe{
  width:100%;
  height:85vh;
  border:none;
  border-radius:15px;
}
</style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
  <div class="logo">🚀 FF Admin</div>

<div class="menu">
  <a href="#" onclick="showDashboard()">📊 Dashboard</a>

  <a href="https://script.google.com/macros/s/AKfycbwRoeKeDRuo8TuA26_JPACN_Z2jtLoI8CiM1znHnsk3Sk3n3YJ4QrAAl8cFdxFigClS/exec">
    ➕ สร้างออเดอร์
  </a>

  <a href="https://friendfollowofficial.github.io/checkorder/">
    🔎 เช็คออเดอร์
  </a>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main" id="content">
  <!-- Dashboard จะโหลดที่นี่ -->
</div>

<script>

/* ===== API URL ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbyL8h9dF23u9KsUMGRwW0Grley-rL5GDb2y50W-_mqgO5N3pCyWyyRZ0zDom1LBGrHe/exec";

let chart;

/* ===== SHOW DASHBOARD ===== */
function showDashboard(){

  document.getElementById("content").innerHTML = `
    <h2>📊 Dashboard</h2>
    <div class="grid">

      <div class="card">
        <h3>⏳ รอชำระเงิน</h3>
        <div class="count" id="waitingCount">0</div>
        <div id="waitingList"></div>
      </div>

      <div class="card">
        <h3>🚀 กำลังดำเนินการ</h3>
        <div class="count" id="workingCount">0</div>
        <div id="workingList"></div>
      </div>

      <div class="card">
        <h3>📈 สรุปภาพรวม</h3>
        <canvas id="chart"></canvas>
      </div>

    </div>
  `;

  loadData();
}

/* ===== LOAD SCRIPT PAGE INSIDE ===== */
function loadFrame(url){
  document.getElementById("content").innerHTML =
    `<iframe src="${url}"></iframe>`;
}

/* ===== FETCH DASHBOARD DATA ===== */
async function loadData(){

  const res = await fetch(API_URL);
  const data = await res.json();

  const waiting = data.waiting.length;
  const working = data.working.length;

  animateCount(document.getElementById("waitingCount"), waiting);
  animateCount(document.getElementById("workingCount"), working);

  document.getElementById("waitingList").innerHTML =
    data.waiting.map(o =>
      `<div class="list-item">${o.name} (${o.order})</div>`
    ).join("");

  document.getElementById("workingList").innerHTML =
    data.working.map(o =>
      `<div class="list-item">${o.name} (${o.order})</div>`
    ).join("");

  updateChart(waiting,working);
}

/* ===== COUNT ANIMATION ===== */
function animateCount(el,target){
  let start=0;
  const step = Math.max(1, Math.floor(target/20));
  const interval=setInterval(()=>{
    start+=step;
    if(start>=target){
      start=target;
      clearInterval(interval);
    }
    el.innerText=start;
  },30);
}

/* ===== CHART ===== */
function updateChart(waiting,working){

  const ctx=document.getElementById("chart").getContext("2d");
  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['รอชำระเงิน','กำลังดำเนินการ'],
      datasets:[{
        data:[waiting,working],
        backgroundColor:['#ff6b6b','#4dabf7']
      }]
    },
    options:{
      plugins:{legend:{position:'bottom'}}
    }
  });
}

/* ===== INITIAL LOAD ===== */
showDashboard();

/* ===== AUTO REFRESH ===== */
setInterval(()=>{
  if(document.getElementById("waitingCount")){
    loadData();
  }
},15000);

</script>

</body>
</html>
