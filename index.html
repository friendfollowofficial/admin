<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FF Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8f9ff);
  padding:30px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}
.header h1{
  margin:0;
}
.btn{
  background:#6c63ff;
  color:white;
  padding:12px 20px;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(108,99,255,.4);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}
.card{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.05);
}
.card h2{
  margin-top:0;
}
.count{
  font-size:36px;
  font-weight:700;
}
.badge{
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  margin-left:10px;
}
.waiting{ background:#ffe3e3; color:#d62828; }
.working{ background:#e0f2ff; color:#0077b6; }
.list-item{
  background:#f7f7ff;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:14px;
  transition:.2s;
}
.list-item:hover{
  background:#e9ecff;
}
canvas{
  margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
  <h1>📊 Friend Follow Admin</h1>
  <a class="btn" target="_blank"
  href="https://script.google.com/macros/s/AKfycbyL8h9dF23u9KsUMGRwW0Grley-rL5GDb2y50W-_mqgO5N3pCyWyyRZ0zDom1LBGrHe/exec">
    🔗 เปิด API
  </a>
</div>

<div class="grid">

  <div class="card">
    <h2>⏳ รอชำระเงิน 
      <span class="badge waiting">WAIT</span>
    </h2>
    <div class="count" id="waitingCount">0</div>
    <div id="waitingList"></div>
  </div>

  <div class="card">
    <h2>🚀 กำลังดำเนินการ 
      <span class="badge working">WORK</span>
    </h2>
    <div class="count" id="workingCount">0</div>
    <div id="workingList"></div>
  </div>

  <div class="card">
    <h2>📈 สรุปภาพรวม</h2>
    <canvas id="chart"></canvas>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyL8h9dF23u9KsUMGRwW0Grley-rL5GDb2y50W-_mqgO5N3pCyWyyRZ0zDom1LBGrHe/exec";

let chart;
let lastTotal = 0;

function animateCount(element, target){
  let start = 0;
  const duration = 800;
  const step = target / (duration/16);
  const interval = setInterval(()=>{
    start += step;
    if(start >= target){
      start = target;
      clearInterval(interval);
    }
    element.innerText = Math.floor(start);
  },16);
}

async function loadData(){

  const res = await fetch(API_URL);
  const data = await res.json();

  const waiting = data.waiting.length;
  const working = data.working.length;

  animateCount(document.getElementById("waitingCount"), waiting);
  animateCount(document.getElementById("workingCount"), working);

  document.getElementById("waitingList").innerHTML =
    data.waiting.map(o =>
      `<div class="list-item">${o.name} (${o.order})</div>`
    ).join("");

  document.getElementById("workingList").innerHTML =
    data.working.map(o =>
      `<div class="list-item">${o.name} (${o.order})</div>`
    ).join("");

  updateChart(waiting, working);

  if(waiting+working > lastTotal){
    console.log("🔔 มีออเดอร์ใหม่");
  }

  lastTotal = waiting + working;
}

function updateChart(waiting, working){

  const ctx = document.getElementById("chart").getContext("2d");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['รอชำระเงิน','กำลังดำเนินการ'],
      datasets:[{
        data:[waiting,working],
        backgroundColor:['#ff6b6b','#4dabf7']
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{ position:'bottom' }
      }
    }
  });
}

loadData();
setInterval(loadData,15000);

</script>

</body>
</html>
