<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Friend Follow Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}

/* ===== BODY ===== */
body{
  margin:0;
  font-family:'Prompt',sans-serif;
  background:linear-gradient(180deg,#f5f0ff,#e9ddff,#d8ccff);
  display:flex;
  overflow-x:hidden;
  position:relative;
}

/* ===== FLOATING BUBBLES ===== */
.bubble{
  position:fixed;
  bottom:-160px;
  border-radius:50%;
  backdrop-filter:blur(10px);
  background:radial-gradient(circle at 30% 30%,
     rgba(255,255,255,.95),
     rgba(173,216,255,.5),
     rgba(202,166,255,.45),
     rgba(255,182,193,.4));
  box-shadow:
     0 0 60px rgba(200,170,255,.4),
     inset 0 0 30px rgba(255,255,255,.9);
  animation:floatUp linear infinite;
  opacity:.9;
  z-index:-1;
}
@keyframes floatUp{
  from{transform:translateY(0)}
  to{transform:translateY(-120vh)}
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(20px);
  padding:30px 20px;
  min-height:100vh;
  box-shadow:20px 0 60px rgba(170,140,255,.25);
}

.logo{
  font-size:22px;
  font-weight:800;
  margin-bottom:35px;
  background:linear-gradient(90deg,#8fd3ff,#caa6ff,#ff9ed6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.menu a{
  display:block;
  padding:14px;
  border-radius:18px;
  text-decoration:none;
  color:#5a4fcf;
  font-weight:600;
  margin-bottom:12px;
  transition:.3s;
  background:rgba(255,255,255,.6);
  box-shadow:0 10px 25px rgba(180,150,255,.2);
}
.menu a:hover{
  transform:translateX(6px);
  background:linear-gradient(90deg,#e9ddff,#ffe0f4);
  box-shadow:0 20px 50px rgba(180,150,255,.4);
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:40px;
}

.title{
  font-size:26px;
  font-weight:800;
  margin-bottom:25px;
  background:linear-gradient(90deg,#6ed0ff,#ff7fbf);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(25px);
  padding:25px;
  border-radius:30px;
  box-shadow:
    0 25px 60px rgba(170,140,255,.25),
    0 10px 30px rgba(255,170,220,.2);
  transition:.3s;
}
.card:hover{
  transform:translateY(-8px);
  box-shadow:
    0 35px 90px rgba(170,140,255,.4),
    0 20px 50px rgba(255,170,220,.3);
}

.card h3{
  margin-top:0;
  font-size:16px;
  color:#6b5dd3;
  font-weight:700;
}

.count{
  font-size:46px;
  font-weight:800;
  margin:15px 0;
  background:linear-gradient(90deg,#6ed0ff,#ff7fbf);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 10px 40px rgba(200,150,255,.4);
}

.list-item{
  background:linear-gradient(90deg,#f4efff,#ffeaf6);
  padding:10px 14px;
  border-radius:16px;
  margin-bottom:10px;
  font-size:13px;
  box-shadow:0 10px 25px rgba(200,170,255,.2);
}

iframe{
  width:100%;
  height:85vh;
  border:none;
  border-radius:25px;
  box-shadow:0 40px 100px rgba(160,120,255,.3);
}
</style>
</head>

<body>

<!-- BUBBLES -->
<div class="bubble" style="left:8%;width:150px;height:150px;animation-duration:32s;"></div>
<div class="bubble" style="left:25%;width:90px;height:90px;animation-duration:20s;"></div>
<div class="bubble" style="left:55%;width:200px;height:200px;animation-duration:38s;"></div>
<div class="bubble" style="left:75%;width:120px;height:120px;animation-duration:28s;"></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">🫧 Friend Follow</div>

  <div class="menu">
    <a onclick="showDashboard()">📊 Dashboard</a>
    <a href="https://friendfollowofficial.github.io/createorder/">➕ สร้างออเดอร์</a>
    <a href="https://friendfollowofficial.github.io/checkorder/">🔎 เช็คออเดอร์</a>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="content"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyL8h9dF23u9KsUMGRwW0Grley-rL5GDb2y50W-_mqgO5N3pCyWyyRZ0zDom1LBGrHe/exec";
let chart;

function showDashboard(){
  document.getElementById("content").innerHTML=`
    <div class="title">📊 Dashboard Overview</div>
    <div class="grid">
      <div class="card">
        <h3>⏳ รอชำระเงิน</h3>
        <div class="count" id="waitingCount">0</div>
        <div id="waitingList"></div>
      </div>

      <div class="card">
        <h3>🚀 กำลังดำเนินการ</h3>
        <div class="count" id="workingCount">0</div>
        <div id="workingList"></div>
      </div>

      <div class="card">
        <h3>📈 ภาพรวม</h3>
        <canvas id="chart"></canvas>
      </div>
    </div>
  `;
  loadData();
}

async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();

  const waiting=data.waiting.length;
  const working=data.working.length;

  animateCount(document.getElementById("waitingCount"),waiting);
  animateCount(document.getElementById("workingCount"),working);

  document.getElementById("waitingList").innerHTML=
    data.waiting.map(o=>`<div class="list-item">${o.name} (${o.order})</div>`).join("");

  document.getElementById("workingList").innerHTML=
    data.working.map(o=>`<div class="list-item">${o.name} (${o.order})</div>`).join("");

  updateChart(waiting,working);
}

function animateCount(el,target){
  let start=0;
  const step=Math.max(1,Math.floor(target/20));
  const interval=setInterval(()=>{
    start+=step;
    if(start>=target){
      start=target;
      clearInterval(interval);
    }
    el.innerText=start;
  },25);
}

function updateChart(waiting,working){
  const ctx=document.getElementById("chart").getContext("2d");
  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['รอชำระเงิน','กำลังดำเนินการ'],
      datasets:[{
        data:[waiting,working],
        backgroundColor:['#ff9ed6','#8fd3ff']
      }]
    },
    options:{
      plugins:{legend:{position:'bottom'}},
      cutout:'65%'
    }
  });
}

showDashboard();

setInterval(()=>{
  if(document.getElementById("waitingCount")){
    loadData();
  }
},15000);
</script>

</body>
</html>
