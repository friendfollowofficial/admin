<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FF Admin Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Prompt',sans-serif;
background:linear-gradient(180deg,#f6f0ff,#efeafd,#e4d9f7);
display:flex;
overflow-x:hidden;
}

/* ===== Sidebar ===== */
.sidebar{
width:250px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(20px);
padding:30px 20px;
min-height:100vh;
box-shadow:15px 0 50px rgba(180,150,255,.2);
}

.logo{
font-size:20px;
font-weight:800;
margin-bottom:30px;
background:linear-gradient(90deg,#a78bfa,#f472b6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.menu a{
display:block;
margin-bottom:15px;
text-decoration:none;
color:#6b46c1;
font-weight:600;
padding:10px;
border-radius:12px;
transition:.2s;
}
.menu a:hover{
background:#f3e8ff;
}

/* ===== Main ===== */
.main{
flex:1;
padding:40px;
}

h1{
font-size:26px;
margin-bottom:25px;
}

/* ===== Cards ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 15px 40px rgba(150,120,240,.25);
}

.count{
font-size:30px;
font-weight:800;
color:#6b46c1;
}

/* ===== Table ===== */
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
font-size:13px;
text-align:left;
}

th{
background:#faf5ff;
}

input,select{
padding:6px;
border-radius:8px;
border:1px solid #eee;
font-family:'Prompt';
}

.toast{
position:fixed;
top:30px;
right:30px;
background:#6b46c1;
color:white;
padding:12px 20px;
border-radius:10px;
opacity:0;
transition:.3s;
}
.toast.show{opacity:1;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">🚀 FF Admin</div>

<div class="menu">
<a href="#" onclick="showDashboard()">📊 Dashboard</a>
<a href="#" onclick="showOrders()">📋 จัดการออเดอร์</a>
<a href="https://friendfollowofficial.github.io/createorder/" target="_blank">➕ สร้างออเดอร์</a>
<a href="https://friendfollowofficial.github.io/checkorder/" target="_blank">🔎 เช็คออเดอร์</a>
</div>
</div>

<div class="main" id="content">
</div>

<div class="toast" id="toast">บันทึกสำเร็จ</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycby6v_nn7sTs1kEfW2yl4QR8-P4u2FxhVdUsBMD5UMLuvpdZYY7CeY6iUmL0uVm2PeVh/exec";

let dashboardData;
let chart;

/* ================= Dashboard View ================= */
async function showDashboard(){

const res=await fetch(API_URL);
dashboardData=await res.json();

document.getElementById("content").innerHTML=`
<h1>Dashboard Overview</h1>

<div class="grid">
<div class="card">
รายได้วันนี้
<div class="count">${dashboardData.revenueToday}</div>
</div>

<div class="card">
ออเดอร์วันนี้
<div class="count">${dashboardData.ordersToday}</div>
</div>

<div class="card">
<h3>7 วันย้อนหลัง</h3>
<canvas id="chart7"></canvas>
</div>
</div>
`;

renderChart(dashboardData.revenue7days);
}

/* ================= Orders View ================= */
async function showOrders(){

if(!dashboardData){
await showDashboard();
}

document.getElementById("content").innerHTML=`
<h1>จัดการออเดอร์</h1>

<table>
<thead>
<tr>
<th>วันที่</th>
<th>Order</th>
<th>ลูกค้า</th>
<th>บริการ</th>
<th>ราคา</th>
<th>สถานะ</th>
</tr>
</thead>
<tbody id="orderBody"></tbody>
</table>
`;

const tbody=document.getElementById("orderBody");

dashboardData.recentOrders.forEach(o=>{
tbody.innerHTML+=`
<tr>
<td>${o.date}</td>
<td>${o.order}</td>
<td>${o.name}</td>
<td>${o.service}</td>
<td><input value="${o.price}" onchange="updateField('${o.order}','ราคา',this.value)"></td>
<td>
<select onchange="updateField('${o.order}','สถานะ',this.value)">
${statusOptions(o.status)}
</select>
</td>
</tr>
`;
});
}

/* ================= Chart ================= */
function renderChart(list){
const ctx=document.getElementById("chart7").getContext("2d");
if(chart) chart.destroy();

chart=new Chart(ctx,{
type:"line",
data:{
labels:["-6","-5","-4","-3","-2","-1","Today"],
datasets:[{
data:list,
borderColor:"#a78bfa",
backgroundColor:"rgba(167,139,250,.2)",
fill:true
}]
}
});
}

/* ================= Update ================= */
async function updateField(orderId,field,value){
await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"updateOrder",
orderId,
field,
value
})
});
showToast();
}

/* ================= Status Options ================= */
function statusOptions(current){
const list=[
"รอชำระเงิน",
"ชำระเงินแล้ว",
"กำลังดำเนินการ",
"เสร็จงาน",
"ยกเลิก",
"หมดประกัน"
];
return list.map(s=>`
<option ${s===current?"selected":""}>${s}</option>
`).join("");
}

/* ================= Toast ================= */
function showToast(){
const t=document.getElementById("toast");
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}

showDashboard();

</script>

</body>
</html>
