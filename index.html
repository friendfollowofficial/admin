<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FF Dashboard Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Prompt',sans-serif;
background:linear-gradient(180deg,#f6f0ff,#efeafd,#e4d9f7);
overflow-x:hidden;
padding:40px 20px;
}

/* ===== Floating Bubbles ===== */
.bubble{
position:fixed;
bottom:-150px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,
rgba(255,255,255,.9),
rgba(173,216,255,.4),
rgba(202,166,255,.3),
rgba(255,158,214,.25));
box-shadow:
0 0 60px rgba(200,150,255,.4),
inset 0 0 30px rgba(255,255,255,.9);
animation:floatUp linear infinite;
z-index:-1;
}
@keyframes floatUp{
to{transform:translateY(-120vh);}
}

/* ===== Layout ===== */
.container{
max-width:1400px;
margin:auto;
}

h1{
font-size:28px;
font-weight:800;
margin-bottom:30px;
background:linear-gradient(90deg,#6ed0ff,#ff7fbf);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 20px 50px rgba(150,120,240,.25);
transition:.3s;
}
.card:hover{
transform:translateY(-5px);
}

.count{
font-size:34px;
font-weight:800;
margin-top:10px;
color:#6b46c1;
}

.status-box{
margin-top:10px;
font-size:13px;
}

input,select,button{
padding:10px;
border-radius:12px;
border:none;
font-family:'Prompt';
}

button{
cursor:pointer;
background:linear-gradient(90deg,#a78bfa,#f0abfc);
color:white;
font-weight:600;
}

table{
width:100%;
margin-top:25px;
border-collapse:collapse;
}

th,td{
padding:10px;
font-size:13px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#faf8ff;
}

tr:hover{
background:#f7f3ff;
}

/* toast */
.toast{
position:fixed;
top:30px;
right:30px;
background:#6b46c1;
color:white;
padding:15px 25px;
border-radius:15px;
opacity:0;
transform:translateY(-20px);
transition:.3s;
}
.toast.show{
opacity:1;
transform:translateY(0);
}
</style>
</head>

<body>

<!-- bubbles -->
<div class="bubble" style="left:5%;width:130px;height:130px;animation-duration:35s;"></div>
<div class="bubble" style="left:30%;width:90px;height:90px;animation-duration:25s;"></div>
<div class="bubble" style="left:60%;width:160px;height:160px;animation-duration:40s;"></div>
<div class="bubble" style="left:80%;width:100px;height:100px;animation-duration:28s;"></div>

<div class="container">

<h1>🚀 Friend Follow Dashboard</h1>

<!-- KPI -->

<h2>สถานะทั้งหมด</h2>
<div class="grid" id="statusSection"></div>
<br>

<div class="grid">
<div class="card">
<h3>Service Breakdown</h3>
<canvas id="serviceChart"></canvas>
</div>

<div class="card">
<h3>10 ออเดอร์ล่าสุด</h3>
<div id="recentBox"></div>
</div>
</div>

  
<div class="grid">

<div class="card">
รายได้วันนี้
<div class="count" id="revToday">0</div>
</div>

<div class="card">
ออเดอร์วันนี้
<div class="count" id="orderToday">0</div>
</div>

<div class="card">
<h3>7 Day Revenue</h3>
<canvas id="chart7"></canvas>
</div>

</div>

<br>

<!-- Create Order -->
<div class="card">
<h3>➕ สร้างออเดอร์ใหม่</h3>
<input id="name" placeholder="ชื่อลูกค้า">
<input id="service" placeholder="บริการ">
<input id="price" type="number" placeholder="ราคา">
<select id="status">
<option>รอชำระเงิน</option>
<option>ชำระเงินแล้ว</option>
<option>กำลังดำเนินการ</option>
<option>เสร็จงาน</option>
<option>ยกเลิก</option>
<option>หมดประกัน</option>
</select>
<button onclick="createOrder()">สร้างออเดอร์</button>
</div>

<br>

<!-- Search -->
<input id="search" placeholder="ค้นหา Order / ลูกค้า" onkeyup="filterTable()">

<!-- Table -->
<table id="orderTable">
<thead>
<tr>
<th>วันที่</th>
<th>Order</th>
<th>ลูกค้า</th>
<th>บริการ</th>
<th>ราคา</th>
<th>สถานะ</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<div class="toast" id="toast">บันทึกสำเร็จ</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycby6v_nn7sTs1kEfW2yl4QR8-P4u2FxhVdUsBMD5UMLuvpdZYY7CeY6iUmL0uVm2PeVh/exec";

let chart7;
let serviceChart;
let allOrders=[];

/* ================= LOAD ================= */
async function loadDashboard(){
const res=await fetch(API_URL);
const data=await res.json();

allOrders=data.recentOrders || [];

renderKPI(data);
render7DayChart(data.revenue7days || []);
renderStatus(data.statusSummary || {});
renderService(data.serviceStats || {});
renderRecent(data.recentOrders || []);
renderTable(data.recentOrders || []);
}

/* ================= KPI ================= */
function renderKPI(data){
document.getElementById("revToday").innerText=(data.revenueToday||0).toLocaleString();
document.getElementById("orderToday").innerText=data.ordersToday||0;
}

/* ================= 7 DAY CHART ================= */
function render7DayChart(list){

const ctx=document.getElementById("chart7").getContext("2d");
if(chart7) chart7.destroy();

chart7=new Chart(ctx,{
type:"line",
data:{
labels:["-6","-5","-4","-3","-2","-1","Today"],
datasets:[{
label:"Revenue",
data:list,
borderColor:"#a78bfa",
backgroundColor:"rgba(167,139,250,.2)",
fill:true,
tension:.4
}]
}
});
}

/* ================= STATUS ================= */
function renderStatus(statusObj){

let html="";
for(let key in statusObj){
html+=`
<div class="card">
<h3>${key}</h3>
<div class="count">${statusObj[key].length}</div>
</div>
`;
}
document.getElementById("statusSection").innerHTML=html;
}

/* ================= SERVICE ================= */
function renderService(serviceObj){

if(!serviceObj) return;

const labels=Object.keys(serviceObj);
const values=Object.values(serviceObj);

if(labels.length===0) return;

const ctx=document.getElementById("serviceChart").getContext("2d");
if(serviceChart) serviceChart.destroy();

serviceChart=new Chart(ctx,{
type:"doughnut",
data:{
labels:labels,
datasets:[{
data:values,
backgroundColor:[
"#a78bfa","#93c5fd","#f472b6",
"#6ee7b7","#facc15","#fb7185"
]
}]
}
});
}

/* ================= RECENT ================= */
function renderRecent(list){
const box=document.getElementById("recentBox");
box.innerHTML="";

list.slice(0,10).forEach(o=>{
box.innerHTML+=`
<div style="margin-bottom:10px;">
<strong>${o.order}</strong><br>
${o.name} - ${o.service} - ${o.price}฿
</div>
`;
});
}

/* ================= TABLE FULL ================= */
function renderTable(list){

const tbody=document.querySelector("#orderTable tbody");
tbody.innerHTML="";

list.forEach(o=>{
tbody.innerHTML+=`
<tr>
<td>${o.date}</td>
<td>${o.order}</td>
<td>${o.name}</td>
<td>${o.service}</td>
<td>
<input value="${o.price}"
onchange="updateField('${o.order}','ราคา',this.value)">
</td>
<td>
<select onchange="updateField('${o.order}','สถานะ',this.value)">
${statusOptions(o.status)}
</select>
</td>
</tr>
`;
});
}

function statusOptions(current){
const options=[
"รอชำระเงิน",
"ชำระเงินแล้ว",
"กำลังดำเนินการ",
"เสร็จงาน",
"ยกเลิก",
"หมดประกัน"
];

return options.map(s=>`
<option ${s===current?"selected":""}>${s}</option>
`).join("");
}

/* ================= UPDATE FIELD ================= */
async function updateField(orderId,field,value){
await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"updateOrder",
orderId:orderId,
field:field,
value:value
})
});
showToast("บันทึกสำเร็จ");
loadDashboard();
}

/* ================= CREATE ORDER ================= */
async function createOrder(){

const orderData={
"วันที่สั่ง":new Date().toLocaleDateString("en-GB"),
"ชื่อลูกค้า":document.getElementById("name").value,
"รหัสออเดอร์":"FF-"+Date.now(),
"บริการ":document.getElementById("service").value,
"ราคา":document.getElementById("price").value,
"สถานะ":document.getElementById("status").value
};

await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"createOrder",
order:orderData
})
});

showToast("สร้างออเดอร์สำเร็จ");
clearForm();
loadDashboard();
}

function clearForm(){
document.getElementById("name").value="";
document.getElementById("service").value="";
document.getElementById("price").value="";
}

/* ================= SEARCH ================= */
function filterTable(){
const value=document.getElementById("search").value.toLowerCase();
document.querySelectorAll("#orderTable tbody tr").forEach(row=>{
row.style.display=row.innerText.toLowerCase().includes(value)?"":"none";
});
}

/* ================= TOAST ================= */
function showToast(text){
const t=document.getElementById("toast");
t.innerText=text;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}

loadDashboard();
setInterval(loadDashboard,15000);

</script>

</body>
</html>
